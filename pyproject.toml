[project]
name = "anki-chinese-learning-utils"
version = "0.1.0"
description = "Python utilities for the Anki Chinese learning companion app"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "dragonmapper",
    "hanziconv",
    "opencc-python-reimplemented",
    "chinese-english-lookup",
    "pypinyin",
    "google-cloud-texttospeech",
    "beautifulsoup4",
    "lxml",
]

[dependency-groups]
dev = [
    "pytest",
    "pyrefly",
    "ruff",
    "types-requests",
]

[tool.ruff]
target-version = "py311"
src = ["utils"]
line-length = 140

[tool.ruff.lint]
# Rule coverage is widened one family at a time: enable a family, fix every
# violation it reports, then commit. Nothing here is suppressed with a blanket
# ignore just to make the family pass.
#
# Families still to be enabled, with the violation count at the time of the last
# expansion (run `uv run ruff check --select <FAMILY> --statistics` to refresh):
#   PL (221), TRY (193), S (164), ANN (134), EM (115), COM (81), FBT (80),
#   BLE (56), C90 (49), D (1066)
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes (unused imports, undefined names, etc.)
    "I",      # isort (import ordering)
    "N",      # pep8-naming (naming conventions)
    "UP",     # pyupgrade (modern Python syntax)
    "B",      # flake8-bugbear (common bug patterns)
    "C4",     # flake8-comprehensions (better comprehensions)
    "SIM",    # flake8-simplify (code simplifications)
    "RUF",    # ruff-specific rules
    "T20",    # flake8-print (leftover print statements)
    "ARG",    # flake8-unused-arguments
    "RET",    # flake8-return (simplifiable return logic)
    "PERF",   # perflint (performance anti-patterns)
    "FLY",    # flynt (str.format() → f-strings)
    "PIE",    # flake8-pie (miscellaneous bug-prevention lints)
    # --- Families below were already clean when enabled; they only guard against
    # --- regressions. Keep them passing rather than adding ignores.
    "ASYNC",  # flake8-async (blocking calls in async code)
    "FA",     # flake8-future-annotations
    "G",      # flake8-logging-format
    "ICN",    # flake8-import-conventions (import numpy as np, ...)
    "INP",    # flake8-no-pep420 (missing __init__.py in a package)
    "INT",    # flake8-gettext
    "ISC",    # flake8-implicit-str-concat
    "LOG",    # flake8-logging
    "PGH",    # pygrep-hooks (blanket noqa / type: ignore)
    "PT",     # flake8-pytest-style
    "PYI",    # flake8-pyi (stub files)
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise (unnecessary parens on raise)
    "SLF",    # flake8-self (private member access)
    "SLOT",   # flake8-slots
    "T10",    # flake8-debugger (leftover breakpoint()/pdb)
    "TID",    # flake8-tidy-imports
    "YTT",    # flake8-2020 (sys.version misuse)
    # --- Families below required fixes; see git history for the cleanup passes.
    "A",      # flake8-builtins (shadowing builtins)
    "DTZ",    # flake8-datetimez (naive datetimes)
    "ERA",    # eradicate (commented-out code)
    "EXE",    # flake8-executable (shebang / +x consistency)
    "FURB",   # refurb (modernization)
    "PTH",    # flake8-use-pathlib
    "TC",     # flake8-type-checking
]
extend-safe-fixes = ["F401", "F841", "I", "UP", "C4", "SIM", "FLY", "PTH"]
ignore=[
    "T201", # print statement
    "ARG001", # Unused function argument
    # Conflicts with the formatter, which already normalizes implicit string
    # concatenation on a single line.
    "ISC001",
]

[tool.ruff.lint.isort]
known-first-party = ["utils"]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["ARG001"]
"*_test.py" = ["ARG001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Pyrefly is used by the Zed editor for in-editor type checking. Keep its scope
# in sync with the files checked by the `typecheck:python` npm script (and the
# `typecheck:pyrefly` script) so the editor and CI report the same diagnostics.
[tool.pyrefly]
project-includes = [
    "utils/**/*.py",
    "anki/**/*.py",
]
# Each script is run via `uv run --script <file>`, which puts the script's own
# directory on `sys.path` (so e.g. the test imports `connect_dots_notes` as a
# top-level module). Mirror that here so sibling imports resolve.
search-path = ["utils", "utils/hanzi", "utils/tts", "utils/shared"]
python-version = "3.11"

[tool.pyrefly.errors]
missing-import = "error"
implicit-any = "error"
untyped-import = "error"

[tool.pytest.ini_options]
testpaths = ["utils"]
python_files = ["test_*.py", "*_test.py"]
