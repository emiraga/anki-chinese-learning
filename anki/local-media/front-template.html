{{#Trimmed Audio}} {{Trimmed Audio}} {{/Trimmed Audio}} {{^Trimmed Audio}}

<video
  id="ankivideo"
  controls
  preload="auto"
  src="http://[::1]:8080/{{RelativeFilePath}}"
  width="100%"
  data-trim-start="{{trimDurationStart}}"
  data-trim-end="{{trimDurationEnd}}"
  onclick="this.paused ? this.play() : this.pause()"
></video>

<!-- Debug panel: shows why the trimmed start is or isn't being applied. -->
<div
  id="trim-debug-wrap"
  style="font-family: monospace; font-size: 9px; text-align: left"
>
  <button type="button" onclick="ankiTrimToggleDebug()">debug</button>
  <button type="button" onclick="ankiTrimCopyLog()">copy log</button>
  <pre
    id="trim-debug"
    style="
      display: none;
      max-height: 160px;
      overflow: auto;
      background: #111;
      color: #0f0;
      padding: 4px;
      margin: 4px 0;
      white-space: pre-wrap;
      word-break: break-all;
    "
  ></pre>
</div>

<script>
  (function () {
    // Anki swaps the card HTML in place - the back template pulls the whole
    // front template back in via {{FrontSide}}, and any reviewer redraw (a
    // sync, for instance) re-renders the current side - without ever
    // reloading the page. So several copies of this markup, and of this
    // script, share one document: an id lookup has to mean "the newest one",
    // never "the first one that happens to still be in the DOM".
    function lastById(id) {
      var found = document.querySelectorAll("#" + id);
      return found.length ? found[found.length - 1] : null;
    }
    window.ankiLastById = lastById;

    // ---------------------------------------------------------------- debug
    var debugBox = lastById("trim-debug");
    var debugLines = [];
    var t0 = Date.now();
    // Distinguishes concurrent copies of this script: two instances fighting
    // over the same element would look exactly like "the seek doesn't stick".
    var instance = Math.random().toString(36).slice(2, 6);

    function log(msg) {
      var line = "+" + (Date.now() - t0) + "ms [" + instance + "] " + msg;
      debugLines.push(line);
      if (debugLines.length > 400) debugLines.shift();
      if (debugBox) {
        debugBox.textContent = debugLines.join("\n");
        debugBox.scrollTop = debugBox.scrollHeight;
      }
      console.log(line);
    }

    // Bound to this instance's panel, so the buttons never drive a stale one.
    window.ankiTrimToggleDebug = function () {
      debugBox.style.display =
        debugBox.style.display === "none" ? "block" : "none";
    };

    window.ankiTrimCopyLog = function () {
      navigator.clipboard.writeText(debugBox.textContent);
    };

    function ranges(timeRanges) {
      var out = [];
      for (var i = 0; i < timeRanges.length; i++) {
        out.push(
          timeRanges.start(i).toFixed(2) + ".." + timeRanges.end(i).toFixed(2),
        );
      }
      return out.length ? out.join(",") : "none";
    }

    function state() {
      return (
        "rs=" +
        video.readyState +
        " ns=" +
        video.networkState +
        " ct=" +
        video.currentTime.toFixed(3) +
        " dur=" +
        video.duration +
        " paused=" +
        video.paused +
        " seeking=" +
        video.seeking +
        " seekable=[" +
        ranges(video.seekable) +
        "] buffered=[" +
        ranges(video.buffered) +
        "]"
      );
    }

    // ---------------------------------------------------------------- setup
    var videos = document.querySelectorAll("#ankivideo");
    var video = videos[videos.length - 1];
    if (!video) {
      throw new Error("no #ankivideo element found");
    }

    // ------------------------------------------------------------- takeover
    // Nothing tears the previous copy of this script down on its own: its
    // listeners and its 100ms poll keep running, still holding the <video>
    // element that was on screen a moment ago. A detached media element is
    // not silent - it plays whenever something calls play() on it, which its
    // `ended` handler dutifully does - so a leftover instance is heard as the
    // clip playing twice, and one more time for every further redraw. Hand
    // over explicitly instead: the outgoing instance stops listening, drops
    // its timers and pauses its element before this one takes the stage.
    var dead = false;
    var listeners = [];
    var startPoll = null;

    function on(target, event, handler) {
      function wrapped(event_) {
        if (dead) return;
        handler(event_);
      }
      listeners.push([target, event, wrapped]);
      target.addEventListener(event, wrapped);
    }

    function destroy(why) {
      if (dead) return;
      dead = true;
      clearInterval(startPoll);
      listeners.forEach(function (entry) {
        entry[0].removeEventListener(entry[1], entry[2]);
      });
      listeners = [];
      video.pause();
      log("destroyed: " + why);
    }

    if (window.ankiTrimPlayer) {
      window.ankiTrimPlayer.destroy("superseded by instance " + instance);
    }
    // Belt and braces: an instance may have been lost without being destroyed
    // (an older copy of this template, an error before it registered itself),
    // leaving an element that only the DOM still knows about.
    for (var i = 0; i < videos.length - 1; i++) {
      log("pausing leftover #ankivideo " + i);
      videos[i].pause();
    }

    var trimStart = parseFloat(video.dataset.trimStart);
    var trimEnd = parseFloat(video.dataset.trimEnd);

    log(
      "init: #ankivideo count=" +
        videos.length +
        " raw trimStart=" +
        JSON.stringify(video.dataset.trimStart) +
        " raw trimEnd=" +
        JSON.stringify(video.dataset.trimEnd) +
        " src=..." +
        video.currentSrc.slice(-40),
    );

    if (isNaN(trimStart) || trimStart < 0) trimStart = 0;
    if (isNaN(trimEnd) || trimEnd < 0) trimEnd = 0;

    log("init: parsed trimStart=" + trimStart + " trimEnd=" + trimEnd);
    log("init: " + state());

    // A seek is silently dropped while the video is still being fetched over
    // the network, which is why a freshly loaded card used to ignore the
    // trimmed start and only honour it once the file was cached. So keep
    // re-applying the seek until we can see that it actually took effect.
    var startApplied = trimStart === 0;
    // Set while we are the ones seeking, so a manual seek by the user can be
    // told apart from ours and stop us from yanking them back.
    var selfSeeking = false;
    var attempts = 0;
    var unseekableChecks = 0;

    function seekableEnd() {
      var seekable = video.seekable;
      return seekable.length ? seekable.end(seekable.length - 1) : 0;
    }

    function stopEnforcing(why) {
      startApplied = true;
      clearInterval(startPoll);
      log(why);
    }

    // Start playback as soon as the card opens, but only once the playhead is
    // already at the trimmed start - autoplaying first would play back exactly
    // the piece that trimDurationStart is meant to cut off.
    var autoplayed = false;

    function autoplay(reason) {
      if (autoplayed) return;
      autoplayed = true;
      log("autoplay (" + reason + "): " + state());
      var started = video.play();
      if (started && started.catch) {
        started.catch(function (error) {
          // Don't fail silently: if the webview's autoplay policy blocks this,
          // the card would just sit there with no hint as to why.
          log("autoplay BLOCKED: " + error.name + " - " + error.message);
          throw error;
        });
      }
    }

    function applyStart(reason) {
      if (dead) return;
      if (startApplied) {
        // Covers trimStart === 0, where there is nothing to seek to and the
        // clip is good to play the moment it has metadata.
        if (video.readyState >= 1) autoplay(reason);
        return;
      }
      if (video.currentTime >= trimStart - 0.05) {
        startApplied = true;
        log("applyStart(" + reason + "): satisfied, " + state());
        autoplay("start applied");
        return;
      }
      // Deliberately not gated on `duration`: the local media server leaves it
      // Infinity/NaN until the whole file has arrived, so requiring a finite
      // duration here would suppress every attempt on a first, uncached load.
      if (video.readyState < 1) {
        if (attempts < 3) log("applyStart(" + reason + "): rs=0, skip");
        return;
      }
      // A clip served without HTTP Range support is reported as non-seekable:
      // `seekable` stays empty even once the whole file is buffered, and every
      // write to currentTime is clamped straight back to 0. Seeking anyway
      // would just spin - each attempt re-fires seeking/canplay, which would
      // ask for another attempt - so wait for a usable range instead.
      if (seekableEnd() < trimStart) {
        unseekableChecks++;
        if (video.readyState >= 3 && unseekableChecks > 10) {
          stopEnforcing(
            "GIVING UP: clip is not seekable (seekable=[" +
              ranges(video.seekable) +
              "], buffered=[" +
              ranges(video.buffered) +
              "]). The media server must support HTTP Range requests - run " +
              "utils/video/serve_media.py instead of `python3 -m http.server`.",
          );
          // Untrimmed playback still beats a card that does nothing.
          autoplay("not seekable");
        }
        return;
      }
      attempts++;
      // Attempts repeat every 100ms, so only a sample of them is logged.
      var verbose = attempts <= 12 || attempts % 10 === 0;
      if (verbose) {
        log("seek#" + attempts + " (" + reason + ") -> " + trimStart);
        log("  before: " + state());
      }
      selfSeeking = true;
      video.currentTime = trimStart;
      if (verbose) log("  after:  " + state());
    }

    [
      "loadstart",
      "loadedmetadata",
      "loadeddata",
      "durationchange",
      "progress",
      "canplay",
      "canplaythrough",
      "seeked",
      "play",
      "playing",
    ].forEach(function (event) {
      on(video, event, function () {
        log("event " + event + ": " + state());
        applyStart(event);
      });
    });

    // Events that never trigger a seek, but explain a failing one.
    ["emptied", "abort", "error", "stalled", "suspend", "waiting"].forEach(
      function (event) {
        on(video, event, function () {
          log(
            "event " +
              event +
              ": " +
              state() +
              (video.error ? " err=" + video.error.code : ""),
          );
        });
      },
    );

    on(video, "seeked", function () {
      selfSeeking = false;
    });

    // Anki injects card scripts after the markup, so the metadata may already
    // have arrived (cached file) and no further event would be left to wait on.
    applyStart("init");

    // The events above are still not a guarantee: nothing is emitted at the
    // moment a streaming file first becomes seekable, so poll until the seek
    // sticks. This is the same seek the trim buttons perform by hand.
    function pollUntilStartApplied() {
      clearInterval(startPoll);
      var polls = 0;
      startPoll = setInterval(function () {
        if (dead) {
          clearInterval(startPoll);
          return;
        }
        applyStart("poll");
        if (startApplied || ++polls > 200) {
          clearInterval(startPoll);
          log("poll stopped after " + polls + ", applied=" + startApplied);
        }
      }, 100);
    }

    pollUntilStartApplied();

    on(video, "seeking", function () {
      log("event seeking (self=" + selfSeeking + "): " + state());
      // The user took over - stop enforcing the trimmed start.
      if (selfSeeking) return;
      stopEnforcing("manual seek detected, stopped enforcing");
    });

    var lastTimeLog = 0;
    on(video, "timeupdate", function () {
      // Last resort: if every seek above was dropped, retry while it plays.
      applyStart("timeupdate");

      if (Date.now() - lastTimeLog > 500) {
        lastTimeLog = Date.now();
        log("timeupdate: " + state());
      }

      // Cut off the trimmed end by restarting once we get close to it
      if (
        trimEnd > 0 &&
        video.duration &&
        video.currentTime >= video.duration - trimEnd
      ) {
        log("end trim reached, restarting at " + trimStart);
        video.currentTime = trimStart;
      }
    });

    // Manual loop (replaces the native `loop` attribute)
    on(video, "ended", function () {
      log("event ended: " + state());
      video.currentTime = trimStart;
      video.play();
    });

    // Let the trim buttons below take effect without reloading the card.
    function setTrim(newStart, newEnd) {
      log("setTrim(" + newStart + ", " + newEnd + "): " + state());
      trimStart = newStart;
      trimEnd = newEnd;
      video.dataset.trimStart = newStart;
      video.dataset.trimEnd = newEnd;
      startApplied = false;
      // Seek unconditionally so the new start can be previewed straight away,
      // even when playback is already past it.
      selfSeeking = true;
      video.currentTime = trimStart;
      log("setTrim after seek: " + state());
      pollUntilStartApplied();
    }

    function setRate(rate) {
      video.playbackRate = rate;
      video.play();
    }

    // The single handle the markup below reaches the player through, so that
    // no button can end up driving an element this instance has replaced.
    window.ankiTrimPlayer = {
      instance: instance,
      video: video,
      destroy: destroy,
      setTrim: setTrim,
      setRate: setRate,
    };
  })();
</script>

<div
  style="
    font-size: 10px;
    display: flex;
    justify-content: center;
    gap: 0px;
    margin-top: 8px;
    flex-wrap: wrap;
  "
>
  <button type="button" onclick="adjustTrim('trimDurationStart', -0.1)">
    -0.1s
  </button>
  <button type="button" onclick="adjustTrim('trimDurationStart', 0.0)">
    0.0s
  </button>
  <button type="button" onclick="adjustTrim('trimDurationStart', 0.1)">
    +0.1s
  </button>
  <span id="val-start">{{trimDurationStart}}</span>s
  <button type="button" onclick="ankiTrimPlayer.setRate(0.5)">0.5x</button>
  <button type="button" onclick="ankiTrimPlayer.setRate(0.6)">0.6x</button>
  <button type="button" onclick="ankiTrimPlayer.setRate(0.7)">0.7x</button>
  <button type="button" onclick="ankiTrimPlayer.setRate(0.8)">0.8x</button>
  <button type="button" onclick="ankiTrimPlayer.setRate(0.9)">0.9x</button>
  <button type="button" onclick="ankiTrimPlayer.setRate(1.0)">1.0x</button>
  <span id="val-end">{{trimDurationEnd}}</span>s
  <button type="button" onclick="adjustTrim('trimDurationEnd', 0.1)">
    +0.1s
  </button>
  <button type="button" onclick="adjustTrim('trimDurationEnd', -0.1)">
    -0.1s
  </button>
</div>

<!-- Hidden ID element storing your custom alphanumeric ID value -->
<div id="note-id" style="display: none">{{ID}}</div>

<script>
  async function adjustTrim(fieldName, delta) {
    // 1. Get custom alphanumeric ID from the template. Every lookup here goes
    // through ankiLastById for the same reason as in the player above: an
    // older copy of this card's markup may still be in the document, and its
    // fields would be the ones read and written.
    const customIdElement = window.ankiLastById("note-id");
    const customId = customIdElement ? customIdElement.innerText.trim() : "";

    if (!customId) {
      alert(
        "Note ID could not be detected. Ensure {{ID}} is populated in the note.",
      );
      return;
    }

    // Identify target DOM display element
    const valueSpanId =
      fieldName === "trimDurationStart" ? "val-start" : "val-end";
    const targetSpan = window.ankiLastById(valueSpanId);
    const currentVal = parseFloat(targetSpan.innerText) || 0.0;

    // Calculate new value rounded to 1 decimal place
    const newVal = Math.max(0, parseFloat((currentVal + delta).toFixed(1)));

    try {
      // 2. Lookup numeric Note ID via AnkiConnect
      const findResponse = await fetch("http://127.0.0.1:8765", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "findNotes",
          version: 6,
          params: { query: `ID:"${customId}"` },
        }),
      });

      const findResult = await findResponse.json();
      if (findResult.error || !findResult.result?.length) {
        alert(
          "Error finding note ID: " + (findResult.error || "Note not found"),
        );
        return;
      }

      const numericNoteId = findResult.result[0];

      // 3. Persist update to Anki DB
      const updateResponse = await fetch("http://127.0.0.1:8765", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "updateNoteFields",
          version: 6,
          params: {
            note: {
              id: numericNoteId,
              fields: { [fieldName]: newVal.toString() },
            },
          },
        }),
      });

      const updateResult = await updateResponse.json();
      if (updateResult.error) {
        alert("Failed to update field: " + updateResult.error);
        return;
      }

      // 4. Update DOM instantly (No page reload = No blank screen)
      targetSpan.innerText = newVal.toFixed(1);

      // 5. Push the new values into the player so playback reflects them right
      // away, instead of only after the card is reloaded.
      window.ankiTrimPlayer.setTrim(
        parseFloat(window.ankiLastById("val-start").innerText) || 0,
        parseFloat(window.ankiLastById("val-end").innerText) || 0,
      );
    } catch (err) {
      console.error("Connection Error:", err);
      alert(
        "Could not connect to AnkiConnect. Is Anki Desktop running with AnkiConnect installed?",
      );
    }
  }
</script>
{{/Trimmed Audio}}
